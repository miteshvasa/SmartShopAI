services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smartshop:smartshop-local@db:5432/smartshop
    ports:
      - "8000:8000"
    depends_on:
      - db
  streamlit:
    build: .
    env_file: .env
    environment:
      SMARTSHOP_API_URL: http://api:8000
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartshop
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: smartshop-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
