[project]
name = "smartshopai"
version = "0.1.0"
description = "AWS-ready multi-agent e-commerce shopping assistant with Pydantic AI, FastAPI, Streamlit, and secure SQL data access."
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.57.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-ai>=0.0.49",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "streamlit>=1.40.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "evals*", "infra*", "tests*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
